<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in the Stan-verse | badgirlstan.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff007a;
            --neon-purple: #bc13fe;
            --dark-bg: #050505;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
        }

        .font-syncopate { font-family: 'Syncopate', sans-serif; }

        /* Fluid Background Animation */
        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple));
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.4;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%) scale(1); }
            to { transform: translate(20%, 20%) scale(1.2); }
        }

        /* Glitch Effect */
        .glitch {
            position: relative;
            display: inline-block;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00fff9, 2px 2px #ff00c1;
            animation: glitch-anim2 1s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); }
            20% { clip: rect(62px, 9999px, 42px, 0); }
            /* ... more steps ... */
            100% { clip: rect(89px, 9999px, 98px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(10px, 9999px, 85px, 0); }
            100% { clip: rect(40px, 9999px, 20px, 0); }
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px var(--neon-pink);
            transform: translateY(-2px);
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative px-6">

    <div class="bg-blob"></div>
    <div class="scanline"></div>

    <div class="text-center z-10 max-w-2xl">
        <!-- Broken Vinyl/CD SVG -->
        <div class="mb-8 floating">
            <svg width="180" height="180" viewBox="0 0 100 100" class="mx-auto">
                <circle cx="50" cy="50" r="45" fill="#111" stroke="var(--neon-pink)" stroke-width="1" />
                <circle cx="50" cy="50" r="15" fill="#222" />
                <circle cx="50" cy="50" r="5" fill="var(--neon-purple)" />
                <!-- Glitch cracks -->
                <path d="M50 5 L55 30 L45 40 L50 60" stroke="var(--neon-purple)" fill="none" stroke-width="2" />
                <path d="M20 80 L40 70 L50 90" stroke="var(--neon-pink)" fill="none" stroke-width="2" />
            </svg>
        </div>

        <h1 class="text-8xl md:text-9xl font-syncopate font-bold glitch mb-4" data-text="404">404</h1>
        
        <p class="text-xl md:text-2xl font-light tracking-widest uppercase mb-8 opacity-80">
            Page Not Found. <br>
            <span class="text-sm italic lowercase opacity-60">You're stanning a ghost page.</span>
        </p>

        <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
            <a href="/" class="btn-glow px-8 py-3 bg-white text-black font-bold rounded-full transition-all duration-300">
                TAKE ME HOME
            </a>
            <button onclick="history.back()" class="px-8 py-3 border border-white/20 hover:border-white/60 rounded-full transition-all duration-300 uppercase text-xs tracking-tighter">
                Go Back
            </button>
        </div>

        <div class="mt-16 text-xs tracking-widest opacity-30 uppercase font-syncopate">
            badgirlstan.xyz // access_denied
        </div>
    </div>

    <!-- Background Decoration Particles -->
    <div class="absolute bottom-10 left-10 opacity-20 hidden md:block">
        <div class="w-1 h-1 bg-white mb-2"></div>
        <div class="w-1 h-1 bg-white mb-2"></div>
        <div class="w-20 h-[1px] bg-white"></div>
    </div>

    <script>
        // Interactive Mouse Movement for the background blob
        document.addEventListener('mousemove', (e) => {
            const blob = document.querySelector('.bg-blob');
            const x = (e.clientX / window.innerWidth) * 50;
            const y = (e.clientY / window.innerHeight) * 50;
            blob.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
